services:
  - type: web
    name: cronicas-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: off
    dockerContext: ./api/Chronicles.Api
    dockerfilePath: ./api/Chronicles.Api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: PORT
        value: 8080
      - key: ConnectionStrings__Default
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
